
services:
  postgres:
    image: postgres:18
    container_name: space-shooter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: space_shooter
      POSTGRES_USER: game_user
      POSTGRES_PASSWORD: local_dev_password_123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_user -d space_shooter"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
