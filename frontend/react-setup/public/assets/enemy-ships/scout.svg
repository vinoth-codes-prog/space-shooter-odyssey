<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="alien-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Thruster Trail (upwards as enemy flies down) -->
  <path d="M 58,18 Q 64,2 64,0 Q 64,2 70,18 Z" fill="#ff0055" filter="url(#alien-glow)" />

  <!-- Alien Scout Carapace -->
  <path d="M 64,120 
           C 76,95 95,75 118,55 
           C 126,45 110,35 92,42 
           L 78,56 
           L 74,22 
           L 54,22 
           L 50,56 
           L 36,42 
           C 18,35 2,45 10,55 
           C 33,75 52,95 64,120 Z" 
        fill="#3b0716" stroke="#ff2a6d" stroke-width="2.5" />

  <!-- Glowing Malevolent Alien Eye -->
  <circle cx="64" cy="72" r="10" fill="#ff0055" filter="url(#alien-glow)" />
  <circle cx="64" cy="72" r="4" fill="#ffffff" />
  
  <!-- Mandibles -->
  <path d="M 54,95 L 48,118 L 58,105" stroke="#ff2a6d" stroke-width="2" fill="none" />
  <path d="M 74,95 L 80,118 L 70,105" stroke="#ff2a6d" stroke-width="2" fill="none" />
</svg>
