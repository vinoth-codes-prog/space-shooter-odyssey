<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="glow-elite" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Flame -->
  <path d="M 58,14 Q 64,-2 64,-2 Q 64,-2 70,14 Z" fill="#ffd700" filter="url(#glow-elite)" />

  <!-- Elite Gold Crest Wings -->
  <path d="M 64,124 
           L 86,85 
           L 124,70 
           C 128,45 115,25 95,28 
           L 88,48 
           L 75,12 
           L 53,12 
           L 40,48 
           L 33,28 
           C 13,25 0,45 4,70 
           L 42,85 Z" 
        fill="#2a1800" stroke="#facc15" stroke-width="2.5" />

  <!-- Energy Halo Ring -->
  <ellipse cx="64" cy="62" rx="36" ry="18" fill="none" stroke="#fde047" stroke-width="1.8" filter="url(#glow-elite)" stroke-dasharray="8 4" />
  <circle cx="64" cy="62" r="14" fill="#ca8a04" stroke="#ffffff" stroke-width="2" />
  <circle cx="64" cy="62" r="6" fill="#ffffff" filter="url(#glow-elite)" />
</svg>
