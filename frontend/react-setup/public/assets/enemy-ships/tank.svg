<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="glow-purple-e" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Flame -->
  <path d="M 46,16 Q 50,0 50,0 Q 50,0 54,16 Z" fill="#c084fc" filter="url(#glow-purple-e)" />
  <path d="M 74,16 Q 78,0 78,0 Q 78,0 82,16 Z" fill="#c084fc" filter="url(#glow-purple-e)" />

  <!-- Heavy Hexagonal Destroyer -->
  <path d="M 64,118 
           L 96,95 
           L 120,60 
           L 105,30 
           L 82,18 
           L 46,18 
           L 23,30 
           L 8,60 
           L 32,95 Z" 
        fill="#1e1035" stroke="#a855f7" stroke-width="3" />

  <!-- Heavy Triple Cannon Battery -->
  <rect x="60" y="80" width="8" height="35" rx="3" fill="#3b0764" stroke="#e879f9" stroke-width="1.5" />
  <circle cx="64" cy="55" r="18" fill="#581c87" stroke="#c084fc" stroke-width="2" />
  <circle cx="64" cy="55" r="8" fill="#f43f5e" filter="url(#glow-purple-e)" />
</svg>
