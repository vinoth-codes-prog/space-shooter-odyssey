<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="glow-amber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Flame -->
  <path d="M 40,16 Q 44,2 44,0 Q 44,2 48,16 Z" fill="#f59e0b" filter="url(#glow-amber)" />
  <path d="M 80,16 Q 84,2 84,0 Q 84,2 88,16 Z" fill="#f59e0b" filter="url(#glow-amber)" />

