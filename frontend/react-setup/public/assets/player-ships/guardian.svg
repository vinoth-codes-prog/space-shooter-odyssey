<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="guardian-hull" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="30%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="70%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="guardian-flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="rgba(5,150,105,0)" />
    </linearGradient>
  </defs>

  <!-- Heavy Triple Thrusters -->
  <g filter="url(#glow-green)">
    <path d="M 76,190 Q 86,245 86,248 Q 86,245 96,190 Z" fill="url(#guardian-flame)" />
    <path d="M 160,190 Q 170,245 170,248 Q 170,245 180,190 Z" fill="url(#guardian-flame)" />
    <path d="M 116,195 Q 128,252 128,256 Q 128,252 140,195 Z" fill="url(#guardian-flame)" />
  </g>

  <!-- Heavy Armored Dreadnought Body -->
  <g id="guardian-body">
    <!-- Wide Reinforced Citadel Wings -->
    <path d="M 128,20 
             C 155,40 185,55 215,75 
             C 240,92 250,120 248,155 
             C 245,175 225,185 200,180 
             L 190,165 
             L 182,192 
             L 155,192 
             L 145,200 
             L 111,200 
             L 101,192 
             L 74,192 
             L 66,165 
             L 56,180 
             C 31,185 11,175 8,155 
             C 6,120 16,92 41,75 
             C 71,55 101,40 128,20 Z" 
          fill="url(#guardian-hull)" stroke="#34d399" stroke-width="3" />

    <!-- Hardened Fore-Shield Generator -->
    <ellipse cx="128" cy="115" rx="35" ry="35" fill="#065f46" stroke="#6ee7b7" stroke-width="2" />
    <circle cx="128" cy="115" r="22" fill="#10b981" filter="url(#glow-green)" opacity="0.85" />
    <circle cx="128" cy="115" r="12" fill="#ffffff" filter="url(#glow-green)" />

    <!-- Forward Armor Battering Ram Plates -->
    <path d="M 128,30 L 160,70 L 145,95 L 111,95 L 96,70 Z" fill="#047857" stroke="#a7f3d0" stroke-width="2" />
    
    <!-- Armored Sponson Turrets -->
    <rect x="22" y="110" width="16" height="35" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="2" />
    <rect x="218" y="110" width="16" height="35" rx="4" fill="#0f172a" stroke="#34d399" stroke-width="2" />
  </g>
</svg>
